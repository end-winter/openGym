# Build an unsigned openGym iOS .ipa on a macOS cloud runner
#
# The commands mirror the official `build:ios` job in .gitlab-ci.yml.
# An .ipa is a zip with the .app under Payload/. It is NOT signed, so it
# cannot be installed directly — sign it with your own Apple ID (爱思助手 /
# AltStore / Sideloadly) and install on your iPhone. Free Apple ID signing
# expires after 7 days; re-sign to renew.
#
# 使用方式（中文说明见同目录 使用说明.md）：
#   1. 把这个文件放到仓库 .github/workflows/ios-build.yml
#   2. GitHub → Actions → Build unsigned iOS IPA → Run workflow
#   3. 构建完成后在 Artifacts 下载 openGym-<版本>-unsigned.ipa
name: Build unsigned iOS IPA

on:
  workflow_dispatch:      # 手动触发
  push:
    tags:
      - 'v*'

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # VITE_MOBILE=1 build + stage exercise media + `cap sync`
      # (cap sync 在 macOS 上会自动执行 pod install)
      - name: Build mobile bundle
        working-directory: frontend
        run: npm run build:mobile

      # 无签名归档：MARKETING_VERSION 取 frontend/package.json 的版本，
      # 构建号取 android/app/build.gradle 的 versionCode（与官方 CI 一致）
      - name: Archive (unsigned)
        working-directory: frontend
        run: |
          set -eu
          VER="$(node -p "require('./package.json').version")"
          BUILD="$(sed -n 's/^ *versionCode \([0-9]*\).*/\1/p' android/app/build.gradle | sed -n 1p)"
          [ -n "$BUILD" ] || { echo "could not read versionCode from android/app/build.gradle" >&2; exit 1; }
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            MARKETING_VERSION="$VER" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned IPA
        working-directory: frontend
        run: |
          set -eu
          VER="$(node -p "require('./package.json').version")"
          cd ios/App
          rm -rf Payload && mkdir Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qr "$GITHUB_WORKSPACE/openGym-$VER-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: openGym-unsigned-ipa
          path: openGym-*.ipa
          if-no-files-found: error
